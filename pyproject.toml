[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-path-planning"
version = "1.0.0"
description = "低空无人机多维时空 A* 路径规划算法（Python SDK + REST 服务）"
readme = "README.md"
requires-python = ">=3.11"

# 核心算法依赖。接口服务（fastapi/uvicorn）放在 extra 里，
# 只用 SDK 的调用方不必被迫装一整套 Web 框架。
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# 起 REST 服务：pip install "uav-path-planning[server]"
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# 可视化脚本：pip install "uav-path-planning[viz]"
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
]
# 跑测试：pip install "uav-path-planning[test]"
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
all = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["uav_planner*", "src*", "server*"]

# 安装入口只保留 serve（交付物：REST 服务启动脚本）。
# 开发工具（tools/ 下的 plan_*.py / run_stress_test.py / visualize*.py）
# 不属于交付范围，也不作为模块安装——它们直接以脚本方式运行，
# 且依赖通过 uav_planner.pipeline 由本包提供，依赖方向是 tools → uav_planner。
[tool.setuptools]
py-modules = ["serve"]
