[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "uav-path-planning"
version = "2.0.0"
description = "低空无人机 WKT/WGS84 路径规划算法（v2 Python SDK + REST 服务）"
readme = "README.md"
requires-python = ">=3.11"

# 核心算法依赖。接口服务（fastapi/uvicorn）放在 extra 里，
# 只用 SDK 的调用方不必被迫装一整套 Web 框架。
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# 起 REST 服务：pip install "uav-path-planning[server]"
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# 跑测试：pip install "uav-path-planning[test]"
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.scikit-build]
wheel.packages = ["uav_planner", "server"]
cmake.build-type = "Release"

# 安装入口只保留 serve（交付物：REST 服务启动脚本）。
# tools/ 下的 v2 基准与验收脚本直接在源码目录运行，不作为模块安装。
