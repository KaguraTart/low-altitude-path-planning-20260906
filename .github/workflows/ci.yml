name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" -c requirements-runtime.lock

      - name: 导入冒烟测试
        run: python -c "import numpy, scipy, matplotlib, plotly, fastapi, uvicorn; print('imports OK')"

      - name: 单元测试
        run: python -m pytest tests/ -v

      - name: 单机规划端到端
        run: python tools/plan_single.py --output-dir /tmp/ci-single

      - name: 多机规划端到端（含冲突检测与合法性验证）
        run: python tools/plan_multi.py --output-dir /tmp/ci-multi --conflict-check --validate --workers 2

      - name: 小规模压测
        run: python tools/run_stress_test.py --scales 10 50 --seed 20260906 --workers 2 --output /tmp/ci-stress

      - name: REST 服务冒烟（真起服务 + curl，不走 TestClient）
        run: |
          python serve.py --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          # 最多等 30 秒就绪
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && break
            sleep 1
          done
          echo "--- health ---"
          curl -sf http://127.0.0.1:8000/api/v1/health && echo
          echo "--- OpenAPI 可生成 ---"
          curl -sf http://127.0.0.1:8000/openapi.json -o /dev/null
          echo "--- 用示例请求体打 /plan/single ---"
          curl -sf http://127.0.0.1:8000/api/v1/examples/single -o /tmp/ex_single.json
          curl -sf -X POST http://127.0.0.1:8000/api/v1/plan/single \
            -H 'Content-Type: application/json' \
            -d @/tmp/ex_single.json -o /tmp/res_single.json
          python -c "
          import json
          r = json.load(open('/tmp/res_single.json'))
          assert r['status'] == 'planned', r
          assert r['route']['metrics']['total_distance_m'] > 0
          print('REST smoke OK:', r['route']['metrics'])
          "
          python tools/smoke_v2.py --base-url http://127.0.0.1:8000
          kill $SERVER_PID

  stress:
    # 万级规模压测手动触发（耗时约 10 分钟）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[all]" -c requirements-runtime.lock

      - name: 万级规模压测
        run: |
          python tools/run_stress_test.py \
            --scales 10 100 1000 10000 \
            --seed 20260906 --workers 4 --compare \
            --output ./output/stress

      - uses: actions/upload-artifact@v4
        with:
          name: stress-results
          path: output/stress/

  visualize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 生成样例规划结果
        run: python tools/plan_single.py --output-dir /tmp/ci-viz

      - name: 可视化冒烟测试
        run: python tools/visualize.py --input /tmp/ci-viz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualizations
          path: /tmp/ci-viz/visualizations/
