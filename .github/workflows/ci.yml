name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAV_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: 保存冻结输入及提交版本
        run: |
          mkdir -p /tmp/ci-v2/input
          cp -R input/v2_benchmarks /tmp/ci-v2/input/v2_benchmarks
          printf '{"git_sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > /tmp/ci-v2/context.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装当前 SDK、接口与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,test]" -c requirements-runtime.lock

      - name: 导入及原生核冒烟测试
        run: |
          python -c "import numpy, scipy, pydantic, shapely, pyproj, fastapi, uvicorn; from uav_planner.v2 import native; assert native.available(); print(native.engine_info())"

      - name: 单元测试
        run: python -m pytest tests/ -v

      - name: v2 实际 HTTP 与三套小规模功能基准
        run: |
          python serve.py --host 127.0.0.1 --port 8000 > /tmp/ci-v2/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v2/health > /dev/null && break
            kill -0 "$SERVER_PID"
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v2/health > /tmp/ci-v2/health.json
          python tools/smoke_v2.py --base-url http://127.0.0.1:8000 --expected-git-sha "$GITHUB_SHA" --archive-dir /tmp/ci-v2/output/http-smoke > /tmp/ci-v2/smoke.json
          python -S test_api/run_tests.py --base-url http://127.0.0.1:8000 --examples-only --output /tmp/ci-v2/output/test-api > /tmp/ci-v2/test-api.log
          python tools/benchmark_v2.py --base-url http://127.0.0.1:8000 --scales 10 100 --repeats 1 --functional-only --input-directory /tmp/ci-v2/input/v2_benchmarks --output /tmp/ci-v2/output/benchmarks > /tmp/ci-v2/benchmark.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-inputs-and-results
          path: /tmp/ci-v2/

  docker:
    name: Docker 镜像与发布契约
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建不可变镜像
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "uav-ci:$GITHUB_SHA" .
      - name: 验证实际 v2 镜像、异步、Swagger 和文档
        run: bash tools/check_docker_release.sh "uav-ci:$GITHUB_SHA" "$GITHUB_SHA" output/ci-docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-release-contract
          path: output/ci-docker/

  benchmark:
    # Shared-runner functionality only; no dedicated-host 10s performance claim.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAV_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: 保存完整输入及提交版本
        run: |
          mkdir -p /tmp/ci-v2-large/input
          cp -R input/v2_benchmarks /tmp/ci-v2-large/input/v2_benchmarks
          printf '{"git_sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > /tmp/ci-v2-large/context.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[server,test]" -c requirements-runtime.lock
      - name: 三套各 1000 任务的实际 HTTP 功能验证与完整结果归档
        run: |
          python serve.py --host 127.0.0.1 --port 8000 > /tmp/ci-v2-large/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v2/health > /dev/null && break
            kill -0 "$SERVER_PID"
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v2/health > /tmp/ci-v2-large/health.json
          python tools/benchmark_v2.py --base-url http://127.0.0.1:8000 --scales 1000 --repeats 1 --functional-only --input-directory /tmp/ci-v2-large/input/v2_benchmarks --output /tmp/ci-v2-large/output/benchmarks > /tmp/ci-v2-large/benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-large-functional-inputs-and-results
          path: /tmp/ci-v2-large/
