name: low-altitude-path-planning
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${UAV_IMAGE_TAG:?Set UAV_IMAGE_TAG to the tested Git commit}
    image: low-altitude-path-planning:${UAV_IMAGE_TAG:?Set UAV_IMAGE_TAG to the tested Git commit}
    container_name: low-altitude-path-planning-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    cpus: 8
    mem_limit: 8g
    memswap_limit: 8g
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5); assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=5))['native_available']"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
