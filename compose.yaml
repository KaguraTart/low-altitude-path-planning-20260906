name: low-altitude-path-planning
services:
  app:
    build: .
    image: low-altitude-path-planning:9816f8b
    container_name: low-altitude-path-planning-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
